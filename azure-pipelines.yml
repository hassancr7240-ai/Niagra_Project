trigger:
  branches:
    include:
      - feature/initial-development
      - main

variables:
  containerRegistry: 'asp-dev-pmw'               # Azure Container Registry name
  imageRepository: 'pm-automation'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'
  appServiceName: 'fn-dev-pmw'                    # App Service created by manager
  resourceGroup: 'rg-dev-IntegrationTeamAI'

stages:
  - stage: Build
    displayName: Build & Push Docker Image
    jobs:
      - job: BuildAndPush
        displayName: Build and push image
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push to container registry
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(containerRegistry)
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    jobs:
      - deployment: DeployToAppService
        displayName: Deploy to App Service
        environment: development
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: Deploy container to App Service
                  inputs:
                    azureSubscription: 'Niagara Development'
                    appName: $(appServiceName)
                    resourceGroupName: $(resourceGroup)
                    containers: $(containerRegistry).azurecr.io/$(imageRepository):$(tag)
