trigger:
  branches:
    include:
      - feature/initial-development
      - main

variables:
  containerRegistry: 'asp-dev-pmw'               # Azure Container Registry name
  imageRepository: 'pm-automation'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'
  appServiceName: 'fn-dev-pmw'                    # App Service created by manager
  resourceGroup: 'rg-dev-IntegrationTeamAI'

stages:
  - stage: Build
    displayName: Build & Push Docker Image
    jobs:
      - job: BuildAndPush
        displayName: Build and push image
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Build and push to ACR
            inputs:
              azureSubscription: 'Niagara Development'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(containerRegistry)
                docker build -f $(dockerfilePath) \
                  -t $(containerRegistry).azurecr.io/$(imageRepository):$(tag) \
                  -t $(containerRegistry).azurecr.io/$(imageRepository):latest \
                  .
                docker push $(containerRegistry).azurecr.io/$(imageRepository):$(tag)
                docker push $(containerRegistry).azurecr.io/$(imageRepository):latest

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    jobs:
      - job: DeployToAppService
        displayName: Deploy to App Service
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy container to App Service
            inputs:
              azureSubscription: 'Niagara Development'
              appName: $(appServiceName)
              resourceGroupName: $(resourceGroup)
              containers: $(containerRegistry).azurecr.io/$(imageRepository):$(tag)
