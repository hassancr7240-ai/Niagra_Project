<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Automation System — Login</title>
  <link rel="stylesheet" href="/frontend/static/css/styles.css" />
  <style>
    body { background: #1B3A6B; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .login-card { background:#fff; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); padding:48px 40px; width:100%; max-width:420px; }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo h1 { font-size:22px; font-weight:700; color:#1B3A6B; margin:8px 0 4px; }
    .login-logo p { color:#666; font-size:13px; margin:0; }
    .login-logo .badge { display:inline-block; background:#E8F4FD; color:#1B3A6B; font-size:11px; font-weight:600; padding:3px 10px; border-radius:12px; margin-top:6px; }
    .form-group { margin-bottom:20px; }
    .form-group label { display:block; font-size:12px; font-weight:600; color:#444; margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
    .form-group input, .form-group select { width:100%; padding:12px 14px; border:1.5px solid #DDE1E7; border-radius:8px; font-size:14px; outline:none; transition:border-color .2s; box-sizing:border-box; }
    .form-group input:focus, .form-group select:focus { border-color:#1B3A6B; }
    .btn-primary { width:100%; padding:13px; background:#1B3A6B; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; transition:background .2s; }
    .btn-primary:hover { background:#152E56; }
    .btn-primary:disabled { background:#9BACC5; cursor:not-allowed; }
    .error-msg { background:#FDEBD0; border:1px solid #F39C12; color:#7D3C0C; padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:16px; display:none; }
    .dev-notice { text-align:center; margin-top:20px; font-size:12px; color:#888; }
    .sso-btn { width:100%; padding:12px; background:#fff; color:#333; border:1.5px solid #DDE1E7; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:10px; transition:border-color .2s; }
    .sso-btn:hover { border-color:#1B3A6B; }
    .divider { display:flex; align-items:center; gap:12px; margin:16px 0; }
    .divider span { flex:1; height:1px; background:#EEE; }
    .divider p { color:#AAA; font-size:12px; white-space:nowrap; margin:0; }
    .gear-icon { font-size:48px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="gear-icon">⚙️</div>
      <h1>PM Automation System</h1>
      <p>Preventive Maintenance Management</p>
      <span class="badge">GMP Compliant · Azure Secured</span>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- SSO button (shown when Azure AD is configured) -->
    <button class="sso-btn" id="ssoBtn" style="display:none" onclick="loginSSO()">
      <img src="https://learn.microsoft.com/en-us/azure/active-directory/develop/media/howto-add-branding-in-apps/ms-symbollockup_mssymbol_19.png" width="18" height="18" onerror="this.style.display='none'" />
      Sign in with Microsoft (Azure AD)
    </button>

    <div class="divider" id="divider" style="display:none">
      <span></span><p>or use dev credentials</p><span></span>
    </div>

    <!-- Dev login form (shown in dev mode) -->
    <form id="loginForm" onsubmit="loginDev(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="user@facility.com" />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
    </form>
    <p class="dev-notice" id="devNotice">🔧 Development Mode — No Azure AD configured</p>
  </div>

  <script>
    const API = '';

    async function checkMode() {
      try {
        const r = await fetch(API + '/health');
        const d = await r.json();
        // If Azure AD is configured, show SSO button
        // For now always show dev form since we check via /health
      } catch(e) {}
    }

    async function loginDev(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      hideError();

      const email = document.getElementById('email').value;
      const role = 'Manager'; // dev mode: every signed-in user gets full access

      try {
        const r = await fetch(API + '/dev/token', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, name: email.split('@')[0], role})
        });
        if (!r.ok) throw new Error('Login failed');
        const data = await r.json();
        localStorage.setItem('pm_token', data.access_token);
        localStorage.setItem('pm_user', JSON.stringify({email, name: email.split('@')[0], role}));
        window.location.href = '/frontend/dashboard.html';
      } catch(err) {
        showError('Login failed. Please check your credentials.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    function loginSSO() {
      window.location.href = '/auth/azure/login';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    // If already logged in, redirect to dashboard
    if (localStorage.getItem('pm_token')) {
      window.location.href = '/frontend/dashboard.html';
    }

    checkMode();
  </script>
</body>
</html>
