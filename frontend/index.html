<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Automation System — Login</title>
  <link rel="stylesheet" href="/frontend/static/css/styles.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a2a5e 0%, #1B3A6B 50%, #0e5fa8 100%);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Left panel: login card ── */
    .left-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 480px;
      min-width: 420px;
      padding: 40px 48px;
      background: rgba(255,255,255,0.97);
      box-shadow: 6px 0 40px rgba(0,0,0,0.25);
      position: relative;
      z-index: 2;
    }
    .login-inner { width: 100%; }

    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo img {
      width: 180px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .login-logo h1 {
      font-size: 17px;
      font-weight: 700;
      color: #1B3A6B;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }
    .login-logo p { color: #666; font-size: 13px; }
    .login-logo .badge {
      display: inline-block;
      background: #E8F4FD;
      color: #1B3A6B;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 12px;
      margin-top: 8px;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #444;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid #DDE1E7;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-group input:focus {
      border-color: #1B3A6B;
      box-shadow: 0 0 0 3px rgba(27,58,107,0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #1B3A6B;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-primary:hover { background: #152E56; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { background: #9BACC5; cursor: not-allowed; transform: none; }

    .error-msg {
      background: #FDEBD0;
      border: 1px solid #F39C12;
      color: #7D3C0C;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .sso-btn {
      width: 100%;
      padding: 13px;
      background: #fff;
      color: #333;
      border: 1.5px solid #DDE1E7;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color .2s;
    }
    .sso-btn:hover { border-color: #1B3A6B; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }
    .divider span { flex: 1; height: 1px; background: #EEE; }
    .divider p { color: #AAA; font-size: 12px; white-space: nowrap; }

    .dev-notice { text-align: center; margin-top: 16px; font-size: 12px; color: #999; }

    /* ── Right panel: decorative ── */
    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Glowing circle behind bottle */
    .right-panel::before {
      content: '';
      position: absolute;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .bottle-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: floatBottle 4s ease-in-out infinite;
    }

    .bottle-wrap img.bottle {
      width: 260px;
      max-width: 40vw;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
    }

    .brand-tagline {
      margin-top: 32px;
      color: rgba(255,255,255,0.85);
    }
    .brand-tagline h2 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .brand-tagline p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.5px;
    }

    /* Floating bubbles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      animation: riseBubble linear infinite;
    }
    .bubble:nth-child(1) { width:20px; height:20px; left:15%; animation-duration:7s; animation-delay:0s; }
    .bubble:nth-child(2) { width:12px; height:12px; left:30%; animation-duration:9s; animation-delay:2s; }
    .bubble:nth-child(3) { width:30px; height:30px; left:55%; animation-duration:6s; animation-delay:1s; }
    .bubble:nth-child(4) { width:8px;  height:8px;  left:70%; animation-duration:8s; animation-delay:3s; }
    .bubble:nth-child(5) { width:16px; height:16px; left:85%; animation-duration:10s; animation-delay:0.5s; }

    @keyframes floatBottle {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-18px); }
    }

    @keyframes riseBubble {
      0%   { bottom: -60px; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { bottom: 110%; opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- ── Left: Login ── -->
  <div class="left-panel">
    <div class="login-inner">
      <div class="login-logo">
        <img src="/frontend/images (1).jpg" alt="Niagara" />
        <h1>PM Automation System</h1>
        <p>Preventive Maintenance Management</p>
        <span class="badge">GMP Compliant · Azure Secured</span>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button class="sso-btn" id="ssoBtn" style="display:none" onclick="loginSSO()">
        <img src="https://learn.microsoft.com/en-us/azure/active-directory/develop/media/howto-add-branding-in-apps/ms-symbollockup_mssymbol_19.png" width="18" height="18" onerror="this.style.display='none'" />
        Sign in with Microsoft (Azure AD)
      </button>

      <div class="divider" id="divider" style="display:none">
        <span></span><p>or use dev credentials</p><span></span>
      </div>

      <form id="loginForm" onsubmit="loginDev(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="user@niagara.com" />
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
      </form>
      <p class="dev-notice" id="devNotice">🔧 Development Mode — No Azure AD configured</p>
    </div>
  </div>

  <!-- ── Right: Decorative ── -->
  <div class="right-panel">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="bottle-wrap">
      <img class="bottle" src="/frontend/images.jpg" alt="Niagara Bottle" />
      <div class="brand-tagline">
        <h2>Purified. Trusted. Automated.</h2>
        <p>AI-powered preventive maintenance for Niagara facilities</p>
      </div>
    </div>
  </div>

  <script>
    const API = '';

    async function checkMode() {
      try {
        const r = await fetch(API + '/health');
        await r.json();
      } catch(e) {}
    }

    async function loginDev(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      hideError();

      const email = document.getElementById('email').value;
      const role = 'Manager';

      try {
        const r = await fetch(API + '/dev/token', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, name: email.split('@')[0], role})
        });
        if (!r.ok) throw new Error('Login failed');
        const data = await r.json();
        localStorage.setItem('pm_token', data.access_token);
        localStorage.setItem('pm_user', JSON.stringify({email, name: email.split('@')[0], role}));
        window.location.href = '/frontend/dashboard.html';
      } catch(err) {
        showError('Login failed. Please check your credentials.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    function loginSSO() {
      window.location.href = '/auth/azure/login';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    if (localStorage.getItem('pm_token')) {
      window.location.href = '/frontend/dashboard.html';
    }

    checkMode();
  </script>
</body>
</html>
